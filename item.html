<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Page</title>
  <link rel="stylesheet" href="./assets/css/detail.css">
  <style>
    .header-area {
      position: fixed;
      top: 0;
      width: 100%;
      height: 70px;
      z-index: 1000;
      background-color: #f0f2f0;
    }
  </style>
</head>
<body>

  <!-- 고정 헤더 -->
  <header class="header-area">
    <div class="inner1">
      <a href="index.html"><h2>HOME</h2></a>
    </div>
  </header>

  <div class="content-wrapper">
    <main>
      <section class="main-side">
        <div class="side">
          <div class="inner">
            <div class="title" id="project-title">ITEM PAGE</div>
            <div class="info">
              <div class="m-content">
                <div class="m-title">
                  <p><strong>STORY</strong></p>
                  <p>이 프로젝트는 브랜드 콘셉트와 제품 특성에 맞춘 상세페이지 시리즈로 구성되었습니다.
                  각 제품의 첫인상을 극대화할 수 있도록 비주얼 중심의 디자인을 기획하고,
                  브랜드 정체성을 고려한 카피라이팅, 컬러 톤, 구도 설계에 중점을 두었습니다.</p>
                </div>
              </div>
              <div class="line"></div>
              <div class="index">
                <div class="index_area">
                  <p><strong>01. 허블룸 테일리 톤업 비건 선스크린</strong></p>
                  <p>제품 기능성 및 환경 보호 관련 제품의 특이점 강조</p>
                </div>
                <div class="index_area">
                  <p><strong>02. 갓비움</strong></p>
                  <p>제품 기능 및 컬러 특성 강조</p>
                </div>
                <div class="index_area">
                  <p><strong>03. 에어 등쿠션 안마형 의자기</strong></p>
                  <p>제품 기능 및 컬러 특성 강조하며 리디자인</p>
                </div>

              </div>
            </div>
          </div>
        </div>

        <div class="main-content">
          <div class="preview-content">
            <img src="./assets/images/Desktop - 3-1.png" data-full="./assets/images/Desktop - 3.png" data-top="10%" alt="hy">
          </div>
          <div class="preview-content">
            <img src="./assets/images/hy_main.png" data-full="./assets/images/hy.png" data-top="10%" alt="hy">
          </div>
          <div class="preview-content">
             <img src="./assets/images/me_main.png" data-full="./assets/images/me.png" data-top="10%" alt="me">
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="lightbox-overlay" id="lightbox">
    <img src="" alt="Zoomed Image">
  </div>

  <script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = lightbox.querySelector("img");

    document.querySelectorAll(".preview-content img").forEach(img => {
      img.addEventListener("click", () => {
        lightboxImg.src = img.dataset.full;
        lightbox.style.display = "block";
        const top = img.dataset.top || "0";
        lightboxImg.style.marginTop = top;
      });
    });

    lightbox.addEventListener("click", () => {
      lightbox.style.display = "none";
      lightboxImg.src = "";
    });
  </script>
</body>
</html>
